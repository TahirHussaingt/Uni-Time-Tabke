{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ branding.department_name }}">
  <title>{% block title %}{{ branding.university_name }}{% endblock %}</title>
  {% if branding.logo_available %}<link rel="icon" href="{% static branding.logo_path %}" type="image/svg+xml">{% endif %}
  <link rel="stylesheet" href="{% static 'css/tokens.css' %}">
  <link rel="stylesheet" href="{% static 'css/base.css' %}">
  <link rel="stylesheet" href="{% static 'css/layout.css' %}">
  <link rel="stylesheet" href="{% static 'css/components.css' %}">
  <link rel="stylesheet" href="{% static 'css/forms.css' %}">
  <link rel="stylesheet" href="{% static 'css/tables.css' %}">
  <link rel="stylesheet" href="{% static 'css/timetable.css' %}">
  <link rel="stylesheet" href="{% static 'css/responsive.css' %}">
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to main content</a>
  <div class="app-shell">
    {% include "partials/sidebar.html" %}
    <div class="shell-content">
      {% include "partials/topbar.html" %}
      <main id="main-content" class="page-content" tabindex="-1">
        {% block content %}{% endblock %}
      </main>
      {% include "partials/footer.html" %}
    </div>
  </div>
  <script src="{% static 'js/navigation.js' %}" defer></script>
  <script src="{% static 'js/main.js' %}" defer></script>
</body>
</html>
